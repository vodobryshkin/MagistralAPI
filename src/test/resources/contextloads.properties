# Значения для smoke-теста MagistralApiApplicationTests.contextLoads.
# Инфраструктура НЕ поднимается в контейнерах: вместо реального PostgreSQL используется
# встроенная in-memory H2 в режиме совместимости с PostgreSQL, а внешние подключения
# (RabbitMQ/Redis/MinIO/SMTP) при старте контекста не выполняются.

# --- БД: встроенная H2 вместо PostgreSQL ---
# Схему Hibernate не генерирует (ddl-auto=none) и init-скрипты db/init в тесте не выполняются,
# поэтому Postgres-специфичный DDL (CREATE TYPE ... ENUM, jsonb) на H2 не запускается.
# Для contextLoads достаточно живого DataSource — запросов к таблицам тест не делает.
spring.datasource.url=jdbc:h2:mem:contextloads;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

# --- Не пытаться поднимать docker compose при запуске контекста в тестах ---
spring.docker.compose.enabled=false

# --- Не стартовать RabbitMQ-listener'ы (иначе MailQueueConsumer при доступном брокере
# попытается пассивно объявить очереди, которых нет, и упадёт с 404 NOT_FOUND).
# Флаг проброшен в кастомную фабрику RabbitMqConfig.rabbitListenerContainerFactory
# (setAutoStartup), т.к. на ручную фабрику авто-конфиг Spring Boot не влияет. ---
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false

# Заглушки для плейсхолдеров из application.yml (реальные подключения в тесте не используются:
# RabbitAdmin мокается, бакет MinIO не создаётся, listener'ы выключены выше).
