spring:
  application:
    name: MagistralAPI
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  mail:
    host: ${MAIL_HOST:smtp.yandex.ru}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    default-encoding: UTF-8

    ssl:
      enabled: true
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 3000
      "[mail.smtp.writetimeout]": 5000
      "[mail.smtp.ssl.trust]": smtp.gmail.com
  rabbitmq:
    host: ${RABBIT_MQ_HOST:localhost}
    port: ${RABBIT_MQ_PORT:5672}
    username: ${RABBIT_MQ_USERNAME:guest}
    password: ${RABBIT_MQ_PASSWORD:guest}
  data:
    redis:
      host: ${REDIS_DATABASE_HOST:localhost}
      port: ${REDIS_DATABASE_PORT:6379}
      database: ${REDIS_DATABASE_NAME:0}

  docker:
    compose:
      stop:
        command: down
        arguments[0]: --remove-orphans

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

idempotency:
  hmac:
    secret-key: ${HMAC_SHA256_V1}

confirmationlink:
  ttl: 86400
  prefix: ${CONFIRMATION_LINK_PREFIX}


mail:
  confirm:
    queue:
      name: ${RABBIT_MQ_QUEUE_CONFIRMATION_NAME:DefaultQueue}
  document:
    contract-text: №15930э
    customer-name: "ООО «ЛТК Магистраль»"
    mail: ${SPEC_SVYAZ_MAIL}
    queue:
      name: ${RABBIT_MQ_QUEUE_CONFIRMATION_NAME:DocumentQueue}

suitcase:
  receiver:
    fio: ${SUITCASE_RECEIVER_FIO:ООО «ЛТК Магистраль»}
    phone: ${SUITCASE_RECEIVER_PHONE:+74999999999}
  defaults:
    type-of-shipment: ${SUITCASE_TYPE_OF_SHIPMENT:PACKAGE}
    nature-of-investment: ${SUITCASE_NATURE_OF_INVESTMENT:OTHER}

dadata:
  client:
    base-url: https://suggestions.dadata.ru/suggestions/api/4_1/rs/findById/party
    token: ${DADATA_TOKEN}
    timeout: 30s
  address:
    base-url: https://suggestions.dadata.ru/suggestions/api/4_1/rs/suggest/address

jwt:
  secret: ${JWT_SECRET}
  access:
    expiration: ${JWT_ACCESS_EXP}
  refresh:
    expiration: ${JWT_REFRESH_EXP}

redis:
  resend_token.ttl: ${REDIS_RESEND_TOKEN_TTL}

docx:
  templates:
    order-application: "templates/заявка.docx"

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  main-bucket-name: ${MINIO_MAIN_BUCKET_NAME}
  auto-create-bucket: ${MINIO_AUTO_CREATE_BUCKET:true}
  connect-timeout: 3
  read-timeout: 30
  write-timeout: 30
  queue: ${RABBIT_MINIO_QUEUE:MinioQueue}
