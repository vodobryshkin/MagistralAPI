spring:
  application:
    name: MagistralAPI
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  rabbitmq:
    host: ${RABBIT_MQ_HOST:localhost}
    port: ${RABBIT_MQ_PORT:5672}
    username: ${RABBIT_MQ_USERNAME:guest}
    password: ${RABBIT_MQ_PASSWORD:guest}
  data:
    redis:
      host: ${REDIS_DATABASE_HOST:localhost}
      port: ${REDIS_DATABASE_PORT:6379}
      database: ${REDIS_DATABASE_NAME:0}


idempotency:
  hmac:
    secret-key: ${HMAC_SHA256_V1}

confirmationlink:
  ttl: 86400
  prefix: ${CONFIRMATION_LINK_PREFIX}


mail:
  confirm:
    queue:
      name: ${RABBIT_MQ_QUEUE_CONFIRMATION_NAME:DefaultQueue}
  document:
    contract-text: "Договор (публичная оферта) об оказании услуг по экспресс-доставке отправлений от 25.01.2026, г. Санкт-Петербург"
    mail: ${SPEC_SVYAZ_MAIL}
    queue:
      name: ${RABBIT_MQ_QUEUE_CONFIRMATION_NAME:DocumentQueue}

dadata:
  client:
    base-url: https://suggestions.dadata.ru/suggestions/api/4_1/rs/findById/party
    token: ${DADATA_TOKEN}
    timeout: 30s

jwt:
  secret: ${JWT_SECRET}
  access:
    expiration: ${JWT_ACCESS_EXP}
  refresh:
    expiration: ${JWT_REFRESH_EXP}

redis:
  resend_token.ttl: ${REDIS_RESEND_TOKEN_TTL}

docx:
  templates:
    order-application: "templates/заявка.docx"

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  main-bucket-name: ${MINIO_MAIN_BUCKET_NAME}
  auto-create-bucket: ${MINIO_AUTO_CREATE_BUCKET:true}
  connect-timeout: 3
  read-timeout: 30
  write-timeout: 30
  queue: ${RABBIT_MINIO_QUEUE:MinioQueue}