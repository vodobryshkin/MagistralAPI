spring:
  application:
    name: MagistralAPI
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  config:
    import: optional:file:.env[.properties]

idempotency:
  hmac:
    secret-key: ${HMAC_SHA256_V1}