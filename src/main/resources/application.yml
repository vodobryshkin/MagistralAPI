spring:
  application:
    name: MagistralAPI
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

idempotency:
  hmac:
    secret-key: ${HMAC_SHA256_V1}

dadata:
  client:
    base-url: https://suggestions.dadata.ru/suggestions/api/4_1/rs/findById/party
    token: ${DADATA_TOKEN}
    timeout: 30s